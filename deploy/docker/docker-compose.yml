# Attendance app — docker-compose (college VM / any Docker host)
#
#     cd deploy/docker
#     cp .env.example .env                # set POSTGRES_PASSWORD, DJANGO_SECRET_KEY
#     # copy your data into the host paths (see below)
#     docker compose up -d --build
#
# Host data layout under deploy/docker/data/:
#   data/dataset/                 -> your backend/dataset/   (face images, NEI + profile)
#   data/model.pkl                -> your backend/model.pkl
#   data/train_status.json        -> created automatically
#
# and deploy/docker/model/buffalo_l/  -> your Mac's ~/.insightface/models/buffalo_l
#   (this is bind-mounted into the container at the path InsightFace expects)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      DATASET_DIR: /data/dataset
      MODEL_PATH: /data/model.pkl
      TRAIN_STATUS_FILE: /data/train_status.json
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      # Whole data dir -> /data (read-only data plus writable status file)
      - ./data:/data
      # InsightFace model -> the exact path FaceAnalysis() will read
      - ./model/buffalo_l:/home/appuser/.insightface/models/buffalo_l:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers 4 --threads 2 --timeout 120
             --max-requests 1000 --max-requests-jitter 100"

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
