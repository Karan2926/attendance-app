# Attendance app — nginx site config
# Place at: /etc/nginx/sites-available/attendance
# Then: ln -s /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

# HTTP -> HTTPS redirect (certbot will also add its own)
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # Managed by certbot --nginx. Fill in after obtaining the cert,
    # or run `certbot --nginx` which auto-populates these lines.
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # --- Frontend (built React SPA served statically) ---
    root /var/www/attendance-frontend;
    index index.html;

    # API + admin -> Django/gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow larger uploads for classroom photos (default is 1MB)
        client_max_body_size 30m;
    }

    # Django admin all under /admin (API paths also include /admin via urls)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin CSS/JS + collected static)
    location /static/ {
        alias /opt/attendance-app/backend/staticfiles/;
    }

    # Media/face images are NOT served publicly (kept out of web root).
    # If you ever need them, add a location here — but better to keep private.

    # SPA fallback: send unknown non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
